name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest
      - run: docker build --tag bank-marketing-batch:ci .
      - run: docker run --rm bank-marketing-batch:ci --help
